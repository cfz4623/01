## IDF Component Manager Manifest File
## Component dependency: esp32-camera driver (with GC0308 / OV2640 sensor support)
dependencies:
  # ST7796 LCD driver component, maintained by Espressif
  # Version: >= 1.3.0 and < 2.0.0 (^ allows updates within the same major version)
  espressif/esp_lcd_st7796: ^1.3.0
  # FT6X36 touch driver component, maintained by CFSCN
  # Version: >= 1.0.8 and < 2.0.0 (^ allows updates within the same major version)
  cfscn/esp_lcd_touch_ft6x36: ^1.0.8
  # ES8311 audio driver component, maintained by Espressif
  # Version: >= 1.0.0 and < 2.0.0 (^ allows updates within the same major version)
  espressif/es8311: "^1.0.0"  
  # ESP32-Camera driver driver component, maintained by Espressif
  # Version: >= 2.1.0 and < 3.0.0 (^ allows updates within the same major version)
  espressif/esp32-camera: "^2.1.0"
